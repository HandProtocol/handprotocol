name: WXL CI

on:
  pull_request:
    paths:
      - "wxl/**"
      - ".github/workflows/wxl-ci.yml"
  push:
    branches: [main]
    paths:
      - "wxl/**"
      - ".github/workflows/wxl-ci.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wxl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wxl/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx vitest run
      - name: Production build
        run: npm run build
