# Netlify deploy configuration for HAND Protocol
# (also works as a reference for Cloudflare Pages — see _redirects + _headers)

[build]
  publish = "web"
  command = ""  # All static, no build step

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  function = "grants-auth"
  path = "/grants/*"

[[edge_functions]]
  function = "fiscal-auth"
  path = "/fiscal/decision/*"

[[edge_functions]]
  function = "airstreamstudio-auth"
  path = "/mystichearts/airstreamstudio/*"

[[edge_functions]]
  function = "mystichearts-brief-auth"
  path = "/mystichearts/brief/*"

# Business-outreach pitch pages (password-protected, see edge function).
# The demo site /demos/<slug>/ stays public; only /pitch/ is gated.
[[edge_functions]]
  function = "demos-pitch-auth"
  path = "/demos/:slug/pitch"

[[edge_functions]]
  function = "demos-pitch-auth"
  path = "/demos/:slug/pitch/*"

# Internal demo portfolio index (and its data) — gated, operator-only.
# Individual demo sites (/demos/<slug>/) stay public.
[[edge_functions]]
  function = "demos-portfolio-auth"
  path = "/demos"

[[edge_functions]]
  function = "demos-portfolio-auth"
  path = "/demos/"

[[edge_functions]]
  function = "demos-portfolio-auth"
  path = "/demos/index.html"

[[edge_functions]]
  function = "demos-portfolio-auth"
  path = "/demos/portfolio.json"

# Root redirects to foundation campaign (primary surface)
[[redirects]]
  from = "/"
  to = "/foundation-campaign/"
  status = 301
  force = true

