<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>404 — HAND Protocol</title>
<meta name="description" content="The page you reached isn't here. Pick a destination and we'll get you home." />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07090f;
    --bg-2: #0c1220;
    --ink: #f5efe1;
    --ink-dim: #8e8a7e;
    --ink-faint: #4a4940;
    --amber: #d97706;
    --amber-soft: #ffba49;
    --amber-glow: rgba(217, 119, 6, 0.55);
    --rule: rgba(245, 239, 225, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* warm radial wash behind everything */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(900px 600px at 50% 45%, rgba(217,119,6,0.10), transparent 60%),
      radial-gradient(circle at 50% 50%, var(--bg-2) 0%, var(--bg) 75%);
    pointer-events: none;
    z-index: -1;
  }

  /* fine grid, soft */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(217,119,6,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217,119,6,0.04) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 75%);
    pointer-events: none;
    z-index: -1;
  }

  /* ── nav (tiny logo top-left) ── */
  .nav {
    padding: 28px 32px;
    position: relative;
    z-index: 2;
  }
  .nav a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.7;
    transition: opacity 200ms;
  }
  .nav a:hover { opacity: 1; }
  .nav svg { width: 22px; height: 22px; color: var(--amber-soft); }

  /* ── centerpiece ── */
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }
  .scene {
    position: relative;
    width: min(560px, 90vw);
    display: grid;
    place-items: center;
    text-align: center;
  }

  /* The metaphor: HAND logo reaches up, but the small dot (the "page")
     has slipped out of the path. The dot floats above the palm, just
     out of reach, parallax-drifting with the cursor. */
  .hand-stage {
    position: relative;
    width: clamp(220px, 32vw, 320px);
    aspect-ratio: 1;
    margin-bottom: 24px;
    will-change: transform;
    transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .hand-stage svg.hand-mark {
    width: 100%;
    height: 100%;
    color: var(--ink);
    opacity: 0.85;
    filter: drop-shadow(0 0 24px rgba(217,119,6,0.18));
  }
  .hand-stage .miss {
    position: absolute;
    top: 8%;            /* hovers above the palm */
    left: 50%;
    width: 12px;
    height: 12px;
    margin-left: -6px;
    border-radius: 50%;
    background: var(--amber-soft);
    box-shadow:
      0 0 12px var(--amber-glow),
      0 0 32px rgba(217, 119, 6, 0.35);
    will-change: transform;
    transition: transform 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  /* faint trail line connecting hand → missing dot, drawn as a CSS line */
  .hand-stage .trail {
    position: absolute;
    top: 8%;
    left: 50%;
    width: 1px;
    height: 12%;
    background: linear-gradient(180deg, var(--amber-glow), transparent 90%);
    transform: translate(-50%, 0);
    opacity: 0.6;
    pointer-events: none;
  }

  /* big 404 — sits behind/below the hand visually */
  .four {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(72px, 12vw, 156px);
    letter-spacing: -0.06em;
    line-height: 0.95;
    background: linear-gradient(180deg, #fff5dd 0%, var(--amber) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
    will-change: transform;
    transition: transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .copy {
    color: var(--ink);
    font-size: clamp(16px, 1.8vw, 19px);
    line-height: 1.5;
    max-width: 480px;
    margin: 0 auto 8px;
  }
  .acronym {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 28px;
  }
  .acronym b { color: var(--amber-soft); font-weight: 500; }

  /* requested path */
  .path-strip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    margin-bottom: 36px;
    padding: 8px 14px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: rgba(7, 9, 15, 0.4);
    max-width: 100%;
  }
  .path-strip .label {
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 9.5px;
    border-right: 1px solid var(--rule);
    padding-right: 10px;
  }
  .path-strip .path {
    color: var(--amber-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 360px;
  }

  /* destination row */
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
  }
  .links a {
    color: var(--ink);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 10px 14px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: rgba(7, 9, 15, 0.4);
    transition: border-color 180ms, background 180ms, color 180ms, transform 180ms;
  }
  .links a:hover,
  .links a:focus-visible {
    border-color: var(--amber-soft);
    background: rgba(217, 119, 6, 0.08);
    color: var(--amber-soft);
    transform: translateY(-1px);
    outline: none;
  }
  .links a.primary {
    border-color: rgba(217, 119, 6, 0.55);
    background: rgba(217, 119, 6, 0.12);
    color: var(--amber-soft);
  }
  .links a.primary:hover { background: rgba(217, 119, 6, 0.18); }

  /* footer note + experiment link in corner */
  .footer-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
    padding: 20px 24px 28px;
    position: relative;
    z-index: 2;
  }
  .footer-note a {
    color: var(--ink-dim);
    text-decoration: none;
    border-bottom: 1px dashed var(--rule);
    padding-bottom: 1px;
    transition: color 180ms, border-color 180ms;
  }
  .footer-note a:hover {
    color: var(--amber-soft);
    border-color: var(--amber-soft);
  }

  @media (max-width: 540px) {
    .nav { padding: 18px 18px; }
    .path-strip .path { max-width: 220px; }
    .four { margin-bottom: 8px; }
    .acronym { margin-bottom: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hand-stage, .miss, .four { transition: none !important; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" aria-label="HAND Protocol home">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.5"/>
      <path d="M16 8v5m0 6v5m-5-13v10a3 3 0 003 3h4a3 3 0 003-3V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="16" cy="11" r="2" fill="currentColor"/>
    </svg>
    <span>HAND Protocol</span>
  </a>
</nav>

<main>
  <div class="scene">
    <!-- The hand "reaches" upward — the small amber dot (the page you wanted)
         has slipped out of the path. Mouse parallax pulls it a touch further away. -->
    <div class="hand-stage" id="handStage">
      <svg class="hand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="0.8"/>
        <path d="M16 8v5m0 6v5m-5-13v10a3 3 0 003 3h4a3 3 0 003-3V11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <!-- the dot that normally sits at (16,11) is rendered separately below so it can drift -->
      </svg>
      <span class="trail" aria-hidden="true"></span>
      <span class="miss" id="missDot" aria-hidden="true"></span>
    </div>

    <div class="four" id="fourEl">404</div>
    <p class="copy">The page you reached didn't reach back.</p>
    <div class="acronym">
      <b>H</b>olistic · <b>A</b>pproach · <b>N</b>avigation · <b>D</b>isrupted
    </div>

    <div class="path-strip">
      <span class="label">Requested</span>
      <span class="path" id="reqPath">/unknown</span>
    </div>

    <nav class="links" aria-label="Pick a destination">
      <a href="/" class="primary">Home</a>
      <a href="/">Foundation</a>
      <a href="/discovery/">Discovery</a>
      <a href="/reciprocates/">Reciprocates</a>
      <a href="/sovereign-reciprocates/">Sovereign</a>
      <a href="/governance/">Governance</a>
    </nav>
  </div>
</main>

<div class="footer-note">
  Want the wilder version? <a href="/experiments/404-compass/">A 3D-hand compass lives in the experiments shed →</a>
</div>

<script>
  // requested path readout
  (function () {
    const el = document.getElementById('reqPath');
    if (!el) return;
    const p = (location.pathname || '/') + (location.search || '');
    el.textContent = p.length > 64 ? p.slice(0, 61) + '…' : p;
  })();

  // subtle mouse parallax — hand drifts toward cursor, 404 drifts away, dot drifts further away.
  // This is the "almost in reach" gesture: the more you chase, the more it eludes.
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const hand = document.getElementById('handStage');
    const four = document.getElementById('fourEl');
    const dot  = document.getElementById('missDot');
    if (!hand || !four || !dot) return;

    let targetX = 0, targetY = 0, curX = 0, curY = 0;
    let raf = null;

    function onMove(ev) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      // normalize to [-1, 1] centered on viewport
      targetX = ((ev.clientX / w) - 0.5) * 2;
      targetY = ((ev.clientY / h) - 0.5) * 2;
      if (!raf) raf = requestAnimationFrame(tick);
    }
    function tick() {
      // smooth easing
      curX += (targetX - curX) * 0.08;
      curY += (targetY - curY) * 0.08;

      // hand drifts toward cursor, gently (max ~8px each axis)
      hand.style.transform = `translate(${curX *  8}px, ${curY *  8}px)`;
      // 404 drifts AWAY from cursor (~6px), creating parallax depth
      four.style.transform = `translate(${curX * -6}px, ${curY * -4}px)`;
      // the missing dot drifts further away than the hand — it's just out of reach
      dot.style.transform  = `translate(${curX * -14}px, ${curY * -10}px)`;

      // keep ticking if there's still distance to close
      if (Math.abs(targetX - curX) > 0.001 || Math.abs(targetY - curY) > 0.001) {
        raf = requestAnimationFrame(tick);
      } else {
        raf = null;
      }
    }
    window.addEventListener('mousemove', onMove, { passive: true });
    // touch: gentle drift on touchmove
    window.addEventListener('touchmove', (ev) => {
      const t = ev.touches[0];
      if (t) onMove({ clientX: t.clientX, clientY: t.clientY });
    }, { passive: true });
  })();
</script>
</body>
</html>
