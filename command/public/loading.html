<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HAND — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07090f;
    --bg-2: #0c1220;
    --ink: #f5efe1;
    --ink-dim: #9a958a;
    --ink-faint: #4a4940;
    --amber: #d97706;
    --amber-glow: rgba(217, 119, 6, 0.55);
    --amber-soft: #ffba49;
    --grid: rgba(217, 119, 6, 0.06);
    --hud: rgba(245, 239, 225, 0.14);
    --hud-strong: rgba(245, 239, 225, 0.45);
    --rule: rgba(245, 239, 225, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    position: relative;
    display: grid;
    place-items: center;
  }

  /* deep radial + vignette */
  body::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(1200px 800px at 50% 50%, rgba(217,119,6,0.10), transparent 60%),
      radial-gradient(circle at 50% 50%, var(--bg-2) 0%, var(--bg) 70%);
    pointer-events: none;
  }

  /* fine HUD grid */
  body::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(circle at 50% 50%, black 25%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 25%, transparent 72%);
    opacity: 0.55;
    pointer-events: none;
  }

  /* particle canvas */
  #particles {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  /* corner HUD chrome — Inter, light, italic labels, refined */
  .hud {
    position: absolute;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.01em;
    color: var(--ink-dim);
    line-height: 1.7;
    pointer-events: none;
    user-select: none;
  }
  .hud .label {
    color: var(--ink-faint);
    font-style: italic;
    font-weight: 400;
    margin-right: 8px;
  }
  .hud b { color: var(--ink); font-weight: 500; font-style: normal; }
  .hud .amber { color: var(--amber-soft); font-weight: 400; }
  .hud-tl { top: 28px; left: 32px; }
  .hud-tr { top: 28px; right: 32px; text-align: right; }
  .hud-bl { bottom: 28px; left: 32px; }
  .hud-br { bottom: 28px; right: 32px; text-align: right; }

  .hud .row { display: flex; gap: 10px; align-items: center; }
  .hud-tr .row { justify-content: flex-end; }
  .hud .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber-glow);
    animation: blink 1.4s infinite ease-in-out;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  .hud .brand {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--ink);
  }

  /* corner brackets */
  .bracket { position: absolute; width: 28px; height: 28px; border: 1px solid var(--hud); }
  .bracket.tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
  .bracket.tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
  .bracket.bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
  .bracket.br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }

  /* central stage */
  .stage {
    position: relative;
    width: min(460px, 78vw);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }

  /* concentric rings */
  .rings {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .rings svg { width: 100%; height: 100%; overflow: visible; }
  .ring-spin { transform-origin: 50% 50%; transform-box: fill-box; }

  /* ethereal pulse on letter transition */
  .pulse {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 70%;
    height: 70%;
    transform: translate(-50%, -50%) scale(0.25);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 220, 140, 0.30) 0%,
      rgba(255, 186, 73, 0.18) 35%,
      rgba(217, 119, 6, 0) 70%);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    will-change: transform, opacity;
  }
  .pulse.go {
    animation: pulseAnim 1100ms cubic-bezier(0.22, 0.8, 0.2, 1) forwards;
  }
  @keyframes pulseAnim {
    0%   { transform: translate(-50%, -50%) scale(0.25); opacity: 0; }
    18%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.85); opacity: 0; }
  }

  /* ── logo stage: replaces the 3D hand ── */
  .logo-stage {
    position: relative;
    width: 58%;
    aspect-ratio: 1;
    perspective: 1400px;
    display: grid;
    place-items: center;
  }
  /* soft amber bloom behind the logo */
  .logo-stage::before {
    content: '';
    position: absolute;
    inset: -10%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 52%,
      rgba(255, 220, 140, 0.22) 0%,
      rgba(217, 119, 6, 0.16) 35%,
      transparent 65%);
    filter: blur(8px);
    pointer-events: none;
    z-index: 0;
    animation: bloomBreath 6s ease-in-out infinite;
  }
  @keyframes bloomBreath {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.06); }
  }

  /* layer 1: gentle continuous counter-clockwise rotation */
  .logo-rotate {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    transform-style: preserve-3d;
    animation: logoCCW 22s linear infinite;
  }
  @keyframes logoCCW {
    from { transform: rotateZ(0deg); }
    to   { transform: rotateZ(-360deg); }
  }

  /* layer 2: periodic coin flip on Y-axis, with a held rest beat */
  .logo-coin {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    transform-style: preserve-3d;
    animation: logoCoinFlip 7.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  @keyframes logoCoinFlip {
    0%, 35%   { transform: rotateY(0deg) scale(1); }
    55%       { transform: rotateY(360deg) scale(1.04); }
    75%, 100% { transform: rotateY(720deg) scale(1); }
  }

  .logo-coin img {
    width: 86%;
    height: 86%;
    object-fit: contain;
    z-index: 1;
    backface-visibility: visible;
    filter:
      drop-shadow(0 14px 40px rgba(0, 0, 0, 0.55))
      drop-shadow(0 0 28px rgba(217, 119, 6, 0.32))
      drop-shadow(0 0 60px rgba(217, 119, 6, 0.18));
    will-change: transform, filter;
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-rotate, .logo-coin, .logo-stage::before { animation: none !important; }
  }

  /* big letter display under circle */
  .big-letter {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-weight: 200;
    font-size: clamp(48px, 6.2vw, 76px);
    letter-spacing: -0.045em;
    color: var(--ink);
    line-height: 1;
    pointer-events: none;
    text-shadow: 0 0 36px rgba(217, 119, 6, 0.35);
    display: grid;
    place-items: center;
    width: 1.4em;
    height: 1em;
  }
  .big-letter span {
    grid-area: 1 / 1;
    opacity: 0;
    transform: translateY(8px) scale(0.96);
    transition: opacity 360ms ease, transform 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
    background: linear-gradient(180deg, #fff5dd 0%, #f59e0b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .big-letter span.active {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  /* thin underline cursor */
  .big-letter::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--amber-soft), transparent);
    box-shadow: 0 0 12px var(--amber-glow);
  }

  /* HAND acronym word reveal under the line. */
  .word-stack {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translate(-50%, 100%);
    width: 360px;
    height: 1.4em;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--ink);
    pointer-events: none;
    white-space: nowrap;
  }
  .word-stack > span {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    transition:
      opacity 220ms ease,
      clip-path 720ms cubic-bezier(0.7, 0, 0.2, 1);
  }
  .word-stack > span.active {
    opacity: 1;
    clip-path: inset(0 0 0 0);
  }
  .word-stack .connector {
    grid-column: 1;
    justify-self: end;
    padding-right: 0.5em;
    color: var(--ink-faint);
    font-style: italic;
    font-weight: 300;
  }
  .word-stack .key {
    grid-column: 2;
    text-align: center;
    color: var(--amber-soft);
    font-weight: 500;
  }

  /* letter sequence below big letter */
  .letter-stack {
    position: absolute;
    bottom: -84px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .letters {
    display: flex;
    gap: 6px;
    align-items: baseline;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.42em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }
  .letters span {
    display: inline-block;
    transition: color 240ms ease, text-shadow 240ms ease, transform 240ms ease;
  }
  .letters span.active {
    color: var(--amber-soft);
    text-shadow: 0 0 14px var(--amber-glow);
    transform: translateY(-1px);
  }

  /* progress */
  .progress-wrap {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, 80vw);
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .progress-meta { display: flex; justify-content: space-between; width: 100%; }
  .progress-meta .amber { color: var(--amber-soft); }
  .progress-meta .label { font-style: italic; color: var(--ink-faint); font-weight: 400; text-transform: none; letter-spacing: 0.01em; margin-right: 6px; }
  .progress-bar {
    width: 100%;
    height: 1px;
    background: var(--hud);
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    position: absolute; inset: 0 100% 0 0;
    background: linear-gradient(90deg, transparent, var(--amber) 40%, var(--amber-soft));
    box-shadow: 0 0 10px var(--amber-glow);
  }

  /* center label */
  .center-label {
    position: absolute;
    top: 76px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .center-label .label { font-style: italic; color: var(--ink-faint); font-weight: 400; text-transform: none; letter-spacing: 0.01em; margin-right: 6px; }
  .center-label .amber { color: var(--amber-soft); }

  /* small ticks around outer ring */
  .tick { stroke: var(--hud); stroke-width: 1; }
  .tick-strong { stroke: var(--hud-strong); }
</style>
</head>
<body>

<!-- corner brackets -->
<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>

<!-- HUD readouts -->
<div class="hud hud-tl">
  <div class="row"><span class="dot"></span><span class="brand">HAND Protocol</span></div>
  <div><span class="label">node</span><b>01</b> · <span class="amber">boot</span></div>
  <div><span class="label">origin</span><span id="lat">30.2672</span>° N · <span id="lng">-97.7431</span>° W</div>
</div>

<div class="hud hud-tr">
  <div class="row"><span class="label">uplink</span><b>stable</b></div>
  <div><span class="label">session</span><span id="hash">7e2a · b41c · 9f08</span></div>
</div>

<div class="hud hud-bl">
  <div><span class="label">channel</span>ASL · fingerspell</div>
  <div><span class="label">sequence</span><span class="amber" id="seq">H · A · N · D</span></div>
</div>

<div class="hud hud-br">
  <div><span class="label">build</span>0.1.0</div>
</div>

<!-- particle field -->
<canvas id="particles"></canvas>

<div class="center-label"><span class="label">initializing</span><span class="amber">Sovereign Reciprocate</span></div>

<!-- main stage -->
<main class="stage">

  <!-- concentric tech rings -->
  <div class="rings">
    <svg viewBox="0 0 600 600">
      <defs>
        <radialGradient id="ringFade" cx="50%" cy="50%" r="50%">
          <stop offset="60%" stop-color="rgba(245,239,225,0)" />
          <stop offset="100%" stop-color="rgba(245,239,225,0.15)" />
        </radialGradient>
        <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0%" stop-color="rgba(217,119,6,0)" />
          <stop offset="100%" stop-color="rgba(217,119,6,0.8)" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- outer faint ring with ticks -->
      <g class="ring-spin" id="ringOuter">
        <circle cx="300" cy="300" r="282" fill="none" stroke="rgba(245,239,225,0.10)" stroke-width="1" />
        <circle cx="300" cy="300" r="282" fill="none" stroke="rgba(245,239,225,0.35)" stroke-width="1" stroke-dasharray="2 22" />
        <g id="outerTicks"></g>
      </g>

      <!-- mid ring dashed -->
      <g class="ring-spin" id="ringMid">
        <circle cx="300" cy="300" r="232" fill="none" stroke="rgba(245,239,225,0.18)" stroke-width="1" stroke-dasharray="4 8" />
        <g stroke="rgba(245,239,225,0.55)" stroke-width="1.5">
          <line x1="300" y1="58" x2="300" y2="74" />
          <line x1="542" y1="300" x2="526" y2="300" />
          <line x1="300" y1="542" x2="300" y2="526" />
          <line x1="58" y1="300" x2="74" y2="300" />
        </g>
      </g>

      <!-- inner ring with amber sweep -->
      <g class="ring-spin" id="ringSweep">
        <circle cx="300" cy="300" r="200" fill="none" stroke="rgba(217,119,6,0.18)" stroke-width="1" />
        <path id="sweepArc"
          d="M 300 100 A 200 200 0 0 1 480 220"
          fill="none" stroke="url(#sweep)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
      </g>

      <!-- inner solid faint ring -->
      <circle cx="300" cy="300" r="170" fill="none" stroke="rgba(245,239,225,0.10)" stroke-width="1" />
      <circle cx="300" cy="300" r="170" fill="none" stroke="url(#ringFade)" stroke-width="1" />

      <!-- center crosshair micro -->
      <g stroke="rgba(245,239,225,0.25)" stroke-width="0.6">
        <line x1="294" y1="300" x2="288" y2="300" />
        <line x1="306" y1="300" x2="312" y2="300" />
        <line x1="300" y1="294" x2="300" y2="288" />
        <line x1="300" y1="306" x2="300" y2="312" />
      </g>

      <!-- corner data brackets -->
      <g stroke="rgba(245,239,225,0.45)" stroke-width="1.2" fill="none">
        <path d="M 56 300 L 36 300 L 36 280" />
        <path d="M 544 300 L 564 300 L 564 280" />
        <path d="M 300 56 L 300 36 L 280 36" />
        <path d="M 300 544 L 300 564 L 280 564" />
      </g>
    </svg>
  </div>

  <!-- ethereal pulse triggered on every letter transition -->
  <div class="pulse" id="pulseEl"></div>

  <!-- logo (replaces the 3D hand): counter-clockwise drift + periodic coin flip -->
  <div class="logo-stage">
    <div class="logo-rotate">
      <div class="logo-coin">
        <img src="/logo.png" alt="HAND Protocol" decoding="async" draggable="false" />
      </div>
    </div>
  </div>

  <!-- big letter cross-fading under the logo -->
  <div class="big-letter" id="bigLetter">
    <span data-idx="0" class="active">H</span>
    <span data-idx="1">A</span>
    <span data-idx="2">N</span>
    <span data-idx="3">D</span>
  </div>

  <!-- HAND acronym words, one per letter, cross-fade under the line -->
  <div class="word-stack" id="wordStack">
    <span data-idx="0" class="active"><span class="key">Holistic</span></span>
    <span data-idx="1"><span class="key">Approach</span></span>
    <span data-idx="2"><span class="connector">to</span><span class="key">Nurture</span></span>
    <span data-idx="3"><span class="connector">and</span><span class="key">Develop</span></span>
  </div>

  <!-- letter sequence below big letter -->
  <div class="letter-stack">
    <div class="letters" id="letterSeq">
      <span data-idx="0">H</span>
      <span data-idx="1">A</span>
      <span data-idx="2">N</span>
      <span data-idx="3">D</span>
    </div>
  </div>
</main>

<!-- progress -->
<div class="progress-wrap">
  <div class="progress-meta">
    <span><span class="label">loading</span><span class="amber" id="loadStage">signal · link · weave</span></span>
    <span><span class="amber" id="loadPct">00</span>%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<script>
  /* ---------- generate outer compass ticks ---------- */
  (function () {
    const tickG = document.getElementById('outerTicks');
    const tickCount = 60;
    for (let i = 0; i < tickCount; i++) {
      const a = (i / tickCount) * Math.PI * 2 - Math.PI / 2;
      const long = i % 5 === 0;
      const r1 = 282;
      const r2 = long ? 268 : 274;
      const x1 = 300 + Math.cos(a) * r1;
      const y1 = 300 + Math.sin(a) * r1;
      const x2 = 300 + Math.cos(a) * r2;
      const y2 = 300 + Math.sin(a) * r2;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1.toFixed(2));
      line.setAttribute('y1', y1.toFixed(2));
      line.setAttribute('x2', x2.toFixed(2));
      line.setAttribute('y2', y2.toFixed(2));
      line.setAttribute('class', long ? 'tick tick-strong' : 'tick');
      tickG.appendChild(line);
    }
  })();

  /* ---------- ring rotations via Web Animations API ---------- */
  (function () {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    const opts = (dur, dir = 'normal') => ({
      duration: dur, iterations: Infinity, easing: 'linear', direction: dir
    });
    document.getElementById('ringOuter').animate(
      [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], opts(38000));
    document.getElementById('ringMid').animate(
      [{ transform: 'rotate(0deg)' }, { transform: 'rotate(-360deg)' }], opts(24000));
    document.getElementById('ringSweep').animate(
      [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], opts(6000));
  })();

  /* ---------- letter / word cycle (drives H → A → N → D narration) ---------- */
  const letterEls = [...document.querySelectorAll('#letterSeq span')];
  const bigEls = [...document.querySelectorAll('#bigLetter span')];
  const wordEls = [...document.querySelectorAll('#wordStack > span')];
  const seqEl = document.getElementById('seq');
  const pulseEl = document.getElementById('pulseEl');
  let current = 0;
  function setActive(i) {
    letterEls.forEach((el, k) => el.classList.toggle('active', k === i));
    bigEls.forEach((el, k) => el.classList.toggle('active', k === i));
    wordEls.forEach((el, k) => el.classList.toggle('active', k === i));
    if (pulseEl) {
      pulseEl.classList.remove('go');
      // force reflow so the animation restarts
      void pulseEl.offsetWidth;
      pulseEl.classList.add('go');
    }
  }
  setActive(0);
  setInterval(() => {
    current = (current + 1) % 4;
    setActive(current);
  }, 1900);

  /* ---------- progress bar ---------- */
  const fill = document.getElementById('progressFill');
  const pct = document.getElementById('loadPct');
  const stages = ['signal', 'link', 'weave', 'bloom'];
  const stageEl = document.getElementById('loadStage');
  let progress = 0;
  function tickProgress() {
    progress += Math.random() * 1.8 + 0.4;
    if (progress >= 100) progress = 0;
    fill.style.inset = `0 ${100 - progress}% 0 0`;
    pct.textContent = String(Math.floor(progress)).padStart(2, '0');
    const s = Math.min(stages.length - 1, Math.floor(progress / (100 / stages.length)));
    stageEl.textContent = stages[s];
    requestAnimationFrame(tickProgress);
  }
  tickProgress();

  /* ---------- HUD readouts ---------- */
  const hashEl = document.getElementById('hash');
  const latEl = document.getElementById('lat');
  const lngEl = document.getElementById('lng');

  function rndHex(n) {
    return Array.from({length: n}, () => Math.floor(Math.random()*16).toString(16)).join('');
  }
  setInterval(() => {
    hashEl.textContent = `${rndHex(4)} · ${rndHex(4)} · ${rndHex(4)}`;
  }, 1400);
  setInterval(() => {
    latEl.textContent = (30.2672 + (Math.random()-0.5)*0.0008).toFixed(4);
    lngEl.textContent = (-97.7431 + (Math.random()-0.5)*0.0008).toFixed(4);
  }, 600);

  /* ---------- particles ---------- */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initParticles();
  }

  function initParticles() {
    const n = Math.min(160, Math.floor((W*H) / 12000));
    particles = Array.from({length: n}, () => spawnParticle(true));
  }

  function spawnParticle(spread) {
    const cx = W / 2, cy = H / 2;
    const angle = Math.random() * Math.PI * 2;
    const dist = spread ? Math.random() * Math.min(W, H) * 0.5 : Math.min(W, H) * 0.55;
    return {
      x: cx + Math.cos(angle) * dist,
      y: cy + Math.sin(angle) * dist,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.4 + 0.4,
      life: Math.random() * 1.0,
      decay: 0.0015 + Math.random() * 0.0025,
      hueShift: Math.random() < 0.2 ? 1 : 0
    };
  }

  function drawParticles() {
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;

    for (const p of particles) {
      const dx = cx - p.x, dy = cy - p.y;
      const d2 = dx*dx + dy*dy;
      const d = Math.sqrt(d2) || 1;
      const pull = 0.012;
      const tangential = 0.018;
      const tx = -dy / d;
      const ty =  dx / d;
      p.vx += (dx/d) * pull * 0.02 + tx * tangential * 0.015;
      p.vy += (dy/d) * pull * 0.02 + ty * tangential * 0.015;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0 || d < 60) {
        Object.assign(p, spawnParticle(false));
        p.life = 1;
      }

      const alpha = Math.max(0, Math.min(1, p.life)) * 0.85;
      if (p.hueShift) {
        ctx.fillStyle = `rgba(245, 239, 225, ${alpha * 0.6})`;
      } else {
        ctx.fillStyle = `rgba(255, 186, 73, ${alpha})`;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      if (!p.hueShift) {
        ctx.fillStyle = `rgba(217, 119, 6, ${alpha * 0.15})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.lineWidth = 0.5;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx*dx + dy*dy;
        if (d2 < 5200) {
          const al = (1 - d2 / 5200) * 0.10;
          ctx.strokeStyle = `rgba(217, 119, 6, ${al})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(drawParticles);
  }

  window.addEventListener('resize', resize);
  resize();
  drawParticles();
</script>
</body>
</html>
