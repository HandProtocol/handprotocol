# Netlify config for WaterDrop (waterdrop.handprotocol.org)
[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback (also mirrored in public/_redirects for prebuilt CLI deploys).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and the app shell must never be cached, so updates ship.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Content-hashed assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
