# Three Hands Healing — owner-editable site. Deployed as its OWN Netlify site
# (project `3handshealing`), decoupled from the handprotocol repo's git auto-deploy.
# Generated by scripts/gen-netlify-toml.mjs from site.config.mjs.
#
#   cd clients/3handshealing && netlify deploy --prod --build --site <site-id>
#
# This local toml pins the publish dir and functions dir so a deploy from
# inside the monorepo never inherits the root netlify.toml (the HAND site).
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Owner uploads live in Supabase Storage; Netlify Image CDN resizes them.
[images]
  remote_images = ["https://vconmgerblqbworcqkvr\\.supabase\\.co/storage/v1/object/public/three-hands-healing/.*"]

# The old Netlify address sends everyone to the domain (one address per page).
[[redirects]]
  from = "https://3handshealing.netlify.app/*"
  to = "https://3handshealing.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://3handshealing.netlify.app/*"
  to = "https://3handshealing.com/:splat"
  status = 301
  force = true

# /body → page.mjs (a function with a custom path is not reachable at its default URL; see netlify/functions/page.mjs)
[[redirects]]
  from = "/body"
  to = "/.netlify/functions/page"
  status = 200

# /mind → page.mjs (a function with a custom path is not reachable at its default URL; see netlify/functions/page.mjs)
[[redirects]]
  from = "/mind"
  to = "/.netlify/functions/page"
  status = 200

# /pets → page.mjs (a function with a custom path is not reachable at its default URL; see netlify/functions/page.mjs)
[[redirects]]
  from = "/pets"
  to = "/.netlify/functions/page"
  status = 200

# /services → page.mjs (a function with a custom path is not reachable at its default URL; see netlify/functions/page.mjs)
[[redirects]]
  from = "/services"
  to = "/.netlify/functions/page"
  status = 200

# /faq → page.mjs (a function with a custom path is not reachable at its default URL; see netlify/functions/page.mjs)
[[redirects]]
  from = "/faq"
  to = "/.netlify/functions/page"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
